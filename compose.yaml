
services:
  Gamora_Cafe_MySQL:
    image: mysql:8.0
    container_name: Gamora_Cafe_MySQL
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - webdev-db-data:/var/lib/mysql
    networks:
      - Gamora-network

  Gamora_Cafe_PhpMyAdmin:
    image: phpmyadmin
    container_name: Gamora_Cafe_PhpMyAdmin
    restart: unless-stopped
    environment:
      PMA_HOST: Gamora_Cafe_MySQL
    ports:
      - "8081:80"
    networks:
      - Gamora-network

volumes:
  webdev-db-data:

networks:
  Gamora-network: